<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeScripture Edition B - Study Desk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #F5F2EC;
            --text: #1C1C1C;
            --muted: #6C6C6C;
            --accent: #9C7A4D;
            --divider: rgba(0,0,0,0.09);
        }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        .topbar {
            height: 52px;
            background: var(--bg);
            border-bottom: 1px solid var(--divider);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            flex-shrink: 0;
        }

        .topbar h1 {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin: 0;
        }

        .topbar-meta {
            font-size: 12px;
            color: var(--muted);
        }

        .main-content {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .left-pane {
            flex: 1;
            overflow-y: auto;
            border-right: 1px solid var(--divider);
            padding: 40px 32px;
        }

        .right-pane {
            width: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.35);
            border-left: 1px solid var(--divider);
        }

        .pane-header {
            padding: 20px 18px;
            border-bottom: 1px solid var(--divider);
            background: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .pane-header-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin: 0;
        }

        .accordion-sections {
            flex: 1;
            padding: 16px 0;
            overflow-y: auto;
        }

        .accordion {
            border-bottom: 1px solid var(--divider);
        }

        .accordion-header {
            padding: 14px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(156, 122, 77, 0.04);
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            transition: background 0.2s ease;
            user-select: none;
        }

        .accordion-header:hover {
            background: rgba(156, 122, 77, 0.08);
        }

        .accordion-header.active {
            color: var(--accent);
            background: rgba(156, 122, 77, 0.08);
        }

        .accordion-icon {
            font-size: 16px;
            width: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .accordion-header.active .accordion-icon {
            transform: rotate(180deg);
        }

        .accordion-content {
            display: none;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.2);
        }

        .accordion-content.active {
            display: block;
        }

        /* Scripture text styling */
        .verse-container {
            margin-bottom: 1.4em;
        }

        .verse-container .verse-num {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 18px;
            font-weight: bold;
            color: #8b7355;
            margin-right: 8px;
            display: inline-block;
            min-width: 28px;
        }

        .verse-container .verse-text {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text);
        }

        .chapter-heading {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 16px;
            font-weight: normal;
            font-style: italic;
            text-align: center;
            color: #5a4030;
            margin-bottom: 1.5em;
            line-height: 1.5;
        }

        .book-title {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 32px;
            font-weight: normal;
            text-align: center;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text);
        }

        .chapter-num {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 48px;
            font-weight: normal;
            line-height: 1;
            text-align: center;
            margin: 12px 0;
            color: #8b7355;
        }

        /* Right pane commentary styling */
        .accordion-verse-ref {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 10px;
            display: block;
        }

        .commentary-para {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 10px;
        }

        .commentary-quote {
            font-size: 11px;
            line-height: 1.5;
            color: #3d2b1f;
            background: rgba(156, 122, 77, 0.04);
            padding: 8px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 2px 2px 0;
            margin-top: 8px;
            font-style: italic;
        }

        .quote-source {
            font-size: 9px;
            color: var(--muted);
            margin-top: 4px;
            font-style: normal;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="topbar">
            <h1>Edition B: Study Desk</h1>
            <div class="topbar-meta">Genesis 1:1-5</div>
        </div>

        <div class="main-content">
            <div class="left-pane">
                <h2 class="book-title">Genesis</h2>
                <p class="chapter-num">1</p>
                <h3 class="chapter-heading" id="chapterHeading"></h3>
                <div id="versesContainer"></div>
            </div>

            <div class="right-pane">
                <div class="pane-header">
                    <h3 class="pane-header-title">Study Notes</h3>
                </div>

                <div class="accordion-sections" id="accordionContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const CHAPTER_ID = 'genesis_1';
        const VERSES = [1, 2, 3, 4, 5];
        let verseData = {};
        let donaldsonData = {};

        async function loadData() {
            try {
                // Load chapter HTML
                const chapResponse = await fetch('../chapters/genesis_1.html');
                const chapHtml = await chapResponse.text();

                // Parse verses from the HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(chapHtml, 'text/html');

                // Extract chapter heading
                const headingEl = doc.querySelector('h3.chapter-heading');
                if (headingEl) {
                    document.getElementById('chapterHeading').textContent = headingEl.textContent;
                }

                // Extract verses
                VERSES.forEach(vNum => {
                    const verseEl = doc.querySelector(`div.verse[id="v${vNum}"] span.verse-text`);
                    if (verseEl) {
                        verseData[vNum] = verseEl.textContent.trim();
                    }
                });

                // Load Donaldson commentary
                const donResponse = await fetch('../donaldson/genesis_1.json');
                donaldsonData = await donResponse.json();

                // Render verses
                renderVerses();
                renderAccordions();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('versesContainer').innerHTML = '<div style="color: red;">Error loading verses</div>';
            }
        }

        function renderVerses() {
            const container = document.getElementById('versesContainer');
            container.innerHTML = '';

            VERSES.forEach(vNum => {
                const verse = document.createElement('div');
                verse.className = 'verse-container';
                verse.innerHTML = `
                    <span class="verse-num">${vNum}</span>
                    <span class="verse-text">${verseData[vNum] || ''}</span>
                `;
                container.appendChild(verse);
            });
        }

        function renderAccordions() {
            const container = document.getElementById('accordionContainer');
            container.innerHTML = '';

            VERSES.forEach(vNum => {
                const commentary = donaldsonData[vNum];

                const accordion = document.createElement('div');
                accordion.className = 'accordion';

                const header = document.createElement('div');
                header.className = 'accordion-header active';
                header.innerHTML = `
                    <span>Verse ${vNum}</span>
                    <span class="accordion-icon">▼</span>
                `;

                const content = document.createElement('div');
                content.className = 'accordion-content active';

                if (commentary) {
                    let html = `<span class="accordion-verse-ref">Commentary</span>`;

                    // Add notes
                    if (commentary.notes && commentary.notes.length) {
                        commentary.notes.slice(0, 1).forEach(note => {
                            html += `<p class="commentary-para">${note.text.substring(0, 180)}${note.text.length > 180 ? '...' : ''}</p>`;
                        });
                    }

                    // Add first quote
                    if (commentary.quotes && commentary.quotes.length) {
                        const quote = commentary.quotes[0];
                        html += `<div class="commentary-quote">
                            "${quote.text.substring(0, 140)}${quote.text.length > 140 ? '...' : ''}"
                            <div class="quote-source">${quote.speaker || 'Source'}</div>
                        </div>`;
                    }

                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<p class="commentary-para">No commentary available</p>';
                }

                header.addEventListener('click', function() {
                    header.classList.toggle('active');
                    content.classList.toggle('active');
                });

                accordion.appendChild(header);
                accordion.appendChild(content);
                container.appendChild(accordion);
            });
        }

        // Load all data on page load
        loadData();
    </script>
</body>
</html>
