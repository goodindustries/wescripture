<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeScripture Edition A - Manuscript Split</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #F5F2EC;
            --text: #1C1C1C;
            --muted: #6C6C6C;
            --accent: #9C7A4D;
            --divider: rgba(0,0,0,0.09);
        }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        .topbar {
            height: 52px;
            background: var(--bg);
            border-bottom: 1px solid var(--divider);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            flex-shrink: 0;
        }

        .topbar h1 {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin: 0;
        }

        .topbar-meta {
            font-size: 12px;
            color: var(--muted);
        }

        .main-content {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .left-pane {
            flex: 1;
            overflow-y: auto;
            border-right: 1px solid var(--divider);
            padding: 40px 32px;
        }

        .right-pane {
            width: 380px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.35);
            border-left: 1px solid var(--divider);
        }

        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--divider);
            background: rgba(255, 255, 255, 0.2);
        }

        .tab {
            flex: 1;
            padding: 12px 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab:hover {
            background: rgba(156, 122, 77, 0.08);
            color: var(--text);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(156, 122, 77, 0.04);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Scripture text styling */
        .verse-container {
            margin-bottom: 1.4em;
        }

        .verse-container .verse-num {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 18px;
            font-weight: bold;
            color: #8b7355;
            margin-right: 8px;
            display: inline-block;
            min-width: 28px;
        }

        .verse-container .verse-text {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text);
        }

        .chapter-heading {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 16px;
            font-weight: normal;
            font-style: italic;
            text-align: center;
            color: #5a4030;
            margin-bottom: 1.5em;
            line-height: 1.5;
        }

        .book-title {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 32px;
            font-weight: normal;
            text-align: center;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text);
        }

        .chapter-num {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 48px;
            font-weight: normal;
            line-height: 1;
            text-align: center;
            margin: 12px 0;
            color: #8b7355;
        }

        /* Right pane commentary styling */
        .commentary-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--divider);
        }

        .commentary-item:last-child {
            border-bottom: none;
        }

        .commentary-verse-ref {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 8px;
            display: block;
        }

        .commentary-para {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 10px;
        }

        .commentary-quote {
            font-size: 12px;
            line-height: 1.5;
            color: #3d2b1f;
            background: rgba(156, 122, 77, 0.04);
            padding: 10px 12px;
            border-left: 3px solid var(--accent);
            border-radius: 0 3px 3px 0;
            margin-top: 8px;
            font-style: italic;
        }

        .quote-source {
            font-size: 10px;
            color: var(--muted);
            margin-top: 6px;
            font-style: normal;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            padding: 20px;
            line-height: 1.6;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="topbar">
            <h1>Edition A: Manuscript Split</h1>
            <div class="topbar-meta">Genesis 1:1-5</div>
        </div>

        <div class="main-content">
            <div class="left-pane">
                <h2 class="book-title">Genesis</h2>
                <p class="chapter-num">1</p>
                <h3 class="chapter-heading" id="chapterHeading"></h3>
                <div id="versesContainer"></div>
            </div>

            <div class="right-pane">
                <div class="tab-bar">
                    <div class="tab active" data-tab="cross-refs">Cross Refs</div>
                    <div class="tab" data-tab="commentary">Commentary</div>
                    <div class="tab" data-tab="translations">Translations</div>
                </div>

                <div id="cross-refs" class="tab-content active">
                    <div class="empty-state">Cross-reference data loading...</div>
                </div>

                <div id="commentary" class="tab-content">
                    <div id="commentaryContent"></div>
                </div>

                <div id="translations" class="tab-content">
                    <div class="empty-state">
                        <div>ESV, NIV, KJV variants available</div>
                        <div style="margin-top: 12px; font-size: 12px;">Stub for alternate translations</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CHAPTER_ID = 'genesis_1';
        const VERSES = [1, 2, 3, 4, 5];
        let verseData = {};
        let donaldsonData = {};

        async function loadData() {
            try {
                // Load chapter HTML
                const chapResponse = await fetch('../chapters/genesis_1.html');
                const chapHtml = await chapResponse.text();

                // Parse verses from the HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(chapHtml, 'text/html');

                // Extract chapter heading
                const headingEl = doc.querySelector('h3.chapter-heading');
                if (headingEl) {
                    document.getElementById('chapterHeading').textContent = headingEl.textContent;
                }

                // Extract verses
                VERSES.forEach(vNum => {
                    const verseEl = doc.querySelector(`div.verse[id="v${vNum}"] span.verse-text`);
                    if (verseEl) {
                        verseData[vNum] = verseEl.textContent.trim();
                    }
                });

                // Load Donaldson commentary
                const donResponse = await fetch('../donaldson/genesis_1.json');
                donaldsonData = await donResponse.json();

                // Render verses
                renderVerses();
                renderCommentary();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('versesContainer').innerHTML = '<div style="color: red;">Error loading verses</div>';
            }
        }

        function renderVerses() {
            const container = document.getElementById('versesContainer');
            container.innerHTML = '';

            VERSES.forEach(vNum => {
                const verse = document.createElement('div');
                verse.className = 'verse-container';
                verse.innerHTML = `
                    <span class="verse-num">${vNum}</span>
                    <span class="verse-text">${verseData[vNum] || ''}</span>
                `;
                container.appendChild(verse);
            });
        }

        function renderCommentary() {
            const container = document.getElementById('commentaryContent');
            container.innerHTML = '';

            VERSES.forEach(vNum => {
                const commentary = donaldsonData[vNum];
                if (!commentary) return;

                const item = document.createElement('div');
                item.className = 'commentary-item';

                let html = `<span class="commentary-verse-ref">Verse ${vNum}</span>`;

                // Add notes
                if (commentary.notes && commentary.notes.length) {
                    commentary.notes.forEach(note => {
                        html += `<p class="commentary-para">${note.text.substring(0, 200)}${note.text.length > 200 ? '...' : ''}</p>`;
                    });
                }

                // Add first quote as example
                if (commentary.quotes && commentary.quotes.length) {
                    const quote = commentary.quotes[0];
                    html += `<div class="commentary-quote">
                        "${quote.text.substring(0, 150)}${quote.text.length > 150 ? '...' : ''}"
                        <div class="quote-source">${quote.speaker || 'Unknown'} — ${quote.source || ''}</div>
                    </div>`;
                }

                item.innerHTML = html;
                container.appendChild(item);
            });
        }

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                this.classList.add('active');
                const tabId = this.dataset.tab;
                document.getElementById(tabId).classList.add('active');
            });
        });

        // Load all data on page load
        loadData();
    </script>
</body>
</html>
