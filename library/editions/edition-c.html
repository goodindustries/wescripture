<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeScripture Edition C - Focus Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #F5F2EC;
            --text: #1C1C1C;
            --muted: #6C6C6C;
            --accent: #9C7A4D;
            --divider: rgba(0,0,0,0.09);
        }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
            flex-direction: column;
            position: relative;
        }

        .topbar {
            height: 52px;
            background: var(--bg);
            border-bottom: 1px solid var(--divider);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 100;
        }

        .topbar h1 {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin: 0;
        }

        .topbar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .drawer-toggle {
            background: none;
            border: 1px solid rgba(156, 122, 77, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .drawer-toggle:hover {
            background: rgba(156, 122, 77, 0.08);
            border-color: rgba(156, 122, 77, 0.5);
        }

        .drawer-toggle.open {
            background: rgba(156, 122, 77, 0.12);
            color: var(--text);
        }

        .main-content {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
        }

        .left-pane {
            flex: 1;
            overflow-y: auto;
            padding: 40px 80px;
            transition: filter 0.2s ease;
        }

        .left-pane.drawer-open {
            filter: brightness(0.95);
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 150;
            display: none;
            top: 52px;
        }

        .drawer-overlay.open {
            display: block;
            background: rgba(0, 0, 0, 0.15);
        }

        .drawer {
            position: fixed;
            top: 52px;
            right: 0;
            bottom: 0;
            width: 320px;
            background: var(--bg);
            border-left: 1px solid var(--divider);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200;
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.08);
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 16px 18px;
            border-bottom: 1px solid var(--divider);
            background: rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-header-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin: 0;
        }

        .drawer-close {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drawer-close:hover {
            color: var(--text);
        }

        .pill-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--divider);
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .pill-tab {
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(156, 122, 77, 0.25);
            background: #fff;
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-tab:hover {
            background: rgba(156, 122, 77, 0.08);
            color: var(--text);
        }

        .pill-tab.active {
            background: rgba(156, 122, 77, 0.12);
            color: var(--accent);
            border-color: rgba(156, 122, 77, 0.4);
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
        }

        .drawer-section {
            display: none;
        }

        .drawer-section.active {
            display: block;
        }

        /* Scripture text styling */
        .verse-container {
            margin-bottom: 2em;
            padding-bottom: 1.5em;
            border-bottom: 1px solid var(--divider);
        }

        .verse-container:last-child {
            border-bottom: none;
        }

        .verse-container .verse-num {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 22px;
            font-weight: bold;
            color: #8b7355;
            margin-right: 12px;
            display: inline-block;
            min-width: 32px;
        }

        .verse-container .verse-text {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text);
        }

        .chapter-heading {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 18px;
            font-weight: normal;
            font-style: italic;
            text-align: center;
            color: #5a4030;
            margin-bottom: 2em;
            line-height: 1.6;
        }

        .book-title {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 42px;
            font-weight: normal;
            text-align: center;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text);
        }

        .chapter-num {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 64px;
            font-weight: normal;
            line-height: 1;
            text-align: center;
            margin: 16px 0;
            color: #8b7355;
        }

        /* Drawer content styling */
        .drawer-verse-ref {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 10px;
            display: block;
        }

        .commentary-para {
            font-size: 12px;
            line-height: 1.5;
            color: var(--text);
            margin-bottom: 8px;
        }

        .commentary-quote {
            font-size: 11px;
            line-height: 1.5;
            color: #3d2b1f;
            background: rgba(156, 122, 77, 0.05);
            padding: 8px 10px;
            border-left: 2px solid var(--accent);
            border-radius: 0 2px 2px 0;
            margin-top: 8px;
            font-style: italic;
        }

        .quote-source {
            font-size: 9px;
            color: var(--muted);
            margin-top: 4px;
            font-style: normal;
        }

        .drawer-item {
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--divider);
        }

        .drawer-item:last-child {
            border-bottom: none;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="topbar">
            <h1>Edition C: Focus Mode</h1>
            <div class="topbar-actions">
                <button class="drawer-toggle" id="drawerToggle">Footnotes</button>
            </div>
        </div>

        <div class="main-content">
            <div class="left-pane" id="mainPane">
                <h2 class="book-title">Genesis</h2>
                <p class="chapter-num">1</p>
                <h3 class="chapter-heading" id="chapterHeading"></h3>
                <div id="versesContainer"></div>
            </div>

            <div class="drawer-overlay" id="drawerOverlay"></div>

            <div class="drawer" id="drawer">
                <div class="drawer-header">
                    <h3 class="drawer-header-title">Footnotes</h3>
                    <button class="drawer-close" id="drawerClose">×</button>
                </div>

                <div class="pill-tabs" id="pillTabs"></div>

                <div class="drawer-content" id="drawerContent"></div>
            </div>
        </div>
    </div>

    <script>
        const CHAPTER_ID = 'genesis_1';
        const VERSES = [1, 2, 3, 4, 5];
        let verseData = {};
        let donaldsonData = {};

        const drawerToggle = document.getElementById('drawerToggle');
        const drawer = document.getElementById('drawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const drawerClose = document.getElementById('drawerClose');
        const mainPane = document.getElementById('mainPane');

        function toggleDrawer(open) {
            if (open === undefined) {
                open = !drawer.classList.contains('open');
            }
            drawer.classList.toggle('open', open);
            drawerOverlay.classList.toggle('open', open);
            drawerToggle.classList.toggle('open', open);
            mainPane.classList.toggle('drawer-open', open);
        }

        drawerToggle.addEventListener('click', () => toggleDrawer());
        drawerClose.addEventListener('click', () => toggleDrawer(false));
        drawerOverlay.addEventListener('click', () => toggleDrawer(false));

        async function loadData() {
            try {
                // Load chapter HTML
                const chapResponse = await fetch('../chapters/genesis_1.html');
                const chapHtml = await chapResponse.text();

                // Parse verses from the HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(chapHtml, 'text/html');

                // Extract chapter heading
                const headingEl = doc.querySelector('h3.chapter-heading');
                if (headingEl) {
                    document.getElementById('chapterHeading').textContent = headingEl.textContent;
                }

                // Extract verses
                VERSES.forEach(vNum => {
                    const verseEl = doc.querySelector(`div.verse[id="v${vNum}"] span.verse-text`);
                    if (verseEl) {
                        verseData[vNum] = verseEl.textContent.trim();
                    }
                });

                // Load Donaldson commentary
                const donResponse = await fetch('../donaldson/genesis_1.json');
                donaldsonData = await donResponse.json();

                // Render verses
                renderVerses();
                renderDrawerTabs();
                renderFootnotes();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('versesContainer').innerHTML = '<div style="color: red;">Error loading verses</div>';
            }
        }

        function renderVerses() {
            const container = document.getElementById('versesContainer');
            container.innerHTML = '';

            VERSES.forEach(vNum => {
                const verse = document.createElement('div');
                verse.className = 'verse-container';
                verse.innerHTML = `
                    <span class="verse-num">${vNum}</span>
                    <span class="verse-text">${verseData[vNum] || ''}</span>
                `;
                container.appendChild(verse);
            });
        }

        function renderDrawerTabs() {
            const container = document.getElementById('pillTabs');
            container.innerHTML = '';

            const tabs = [
                { id: 'notes', label: 'Notes' },
                { id: 'quotes', label: 'Quotes' },
                { id: 'cross-refs', label: 'Cross Refs' }
            ];

            tabs.forEach((tab, idx) => {
                const pillTab = document.createElement('button');
                pillTab.className = `pill-tab ${idx === 0 ? 'active' : ''}`;
                pillTab.textContent = tab.label;
                pillTab.dataset.tab = tab.id;
                pillTab.addEventListener('click', function() {
                    document.querySelectorAll('.pill-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.drawer-section').forEach(s => s.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(tab.id).classList.add('active');
                });
                container.appendChild(pillTab);
            });
        }

        function renderFootnotes() {
            const container = document.getElementById('drawerContent');
            container.innerHTML = '';

            // Create sections for notes, quotes, and cross-refs
            const notesSection = document.createElement('div');
            notesSection.id = 'notes';
            notesSection.className = 'drawer-section active';

            const quotesSection = document.createElement('div');
            quotesSection.id = 'quotes';
            quotesSection.className = 'drawer-section';

            const crossSection = document.createElement('div');
            crossSection.id = 'cross-refs';
            crossSection.className = 'drawer-section';

            VERSES.forEach(vNum => {
                const commentary = donaldsonData[vNum];
                if (!commentary) return;

                // Notes section
                if (commentary.notes && commentary.notes.length) {
                    const item = document.createElement('div');
                    item.className = 'drawer-item';
                    let html = `<span class="drawer-verse-ref">Verse ${vNum} Notes</span>`;
                    commentary.notes.slice(0, 1).forEach(note => {
                        html += `<p class="commentary-para">${note.text.substring(0, 160)}${note.text.length > 160 ? '...' : ''}</p>`;
                    });
                    item.innerHTML = html;
                    notesSection.appendChild(item);
                }

                // Quotes section
                if (commentary.quotes && commentary.quotes.length) {
                    const item = document.createElement('div');
                    item.className = 'drawer-item';
                    const quote = commentary.quotes[0];
                    item.innerHTML = `
                        <span class="drawer-verse-ref">Verse ${vNum} Quote</span>
                        <div class="commentary-quote">
                            "${quote.text.substring(0, 130)}${quote.text.length > 130 ? '...' : ''}"
                            <div class="quote-source">${quote.speaker || 'Unknown'}</div>
                        </div>
                    `;
                    quotesSection.appendChild(item);
                }
            });

            // Add stub cross-refs
            crossSection.innerHTML = `<div class="drawer-item"><p class="commentary-para">Cross-reference data loading...</p></div>`;

            container.appendChild(notesSection);
            container.appendChild(quotesSection);
            container.appendChild(crossSection);
        }

        // Load all data on page load
        loadData();
    </script>
</body>
</html>
