<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="title_page" name="chapter-id"/>
<link href="../style/main.css" rel="stylesheet"/>
</head>
<body>
<style>
  .title-shell { max-width: 1080px; margin: 0 auto; padding: 0 22px 48px; }
  .dashboard-title { margin: 1.4rem auto 0.3rem; font: 700 2.1rem/1.1 "EB Garamond", Georgia, serif; color: #26221d; text-align: center; }
  .title-kicker { margin: 0 auto 1rem; max-width: 640px; color: #7f7467; font-size: 1.05rem; line-height: 1.55; text-align: center; }
  .title-links { text-align: center; margin: 0 0 1.25rem; font-size: 0.98rem; color: #5a4e42; line-height: 1.6; }
  .title-links a { color: #9C7A4D; font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(156,122,77,0.35); }
  .title-links a:hover { color: #7A5E38; border-bottom-color: rgba(122,94,56,0.55); }

  .title-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 10px; }
  .panel { background: #fffdf9; border: 1px solid rgba(156,122,77,0.16); border-radius: 24px; box-shadow: 0 12px 28px rgba(60,46,28,0.05); padding: 18px 18px 16px; }
  .panel-kicker { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #9C7A4D; margin-bottom: 6px; }
  .panel-title { margin: 0; font: 700 1.35rem/1.15 "EB Garamond", Georgia, serif; color: #32281f; }
  .panel-subtitle { margin: 6px 0 0; font-size: .95rem; color: #776b5d; line-height: 1.45; }

  .history-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .history-btn { padding: 8px 10px; border: 1px solid rgba(156,122,77,0.18); background: rgba(255,255,255,0.82); border-radius: 12px; cursor: pointer; font: inherit; text-align: left; min-width: 0; }
  .history-btn:hover { background: rgba(156,122,77,0.08); border-color: rgba(156,122,77,0.34); }
  .history-btn:disabled { opacity: 0.55; cursor: default; }
  .history-label { font-size: 12px; font-weight: 700; color: #32281f; }
  .history-meta { font-size: 11px; color: #8a7c6a; margin-top: 2px; }
  .history-empty { margin: 10px 0 0; font-size: 12px; color: #8a7c6a; }

  #title-nav[hidden] { display: none !important; }
  .title-nav-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  #title-nav-back { flex-shrink: 0; margin-top: 1px; padding: 6px 10px; font-size: .88rem; font-weight: 600; color: #9C7A4D; background: #fcfaf6; border: 1px solid rgba(156,122,77,0.28); border-radius: 10px; cursor: pointer; }
  #title-nav-back:hover { background: rgba(156,122,77,0.08); border-color: rgba(156,122,77,0.45); }
  #title-nav-back[hidden] { display: none !important; }
  .title-nav-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .title-nav-grid.chapter-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .title-nav-tile { border: 1px solid rgba(156,122,77,0.14); border-radius: 12px; background: rgba(255,255,255,0.82); padding: 12px 10px; min-height: 78px; cursor: pointer; transition: transform .12s, border-color .12s, background .12s, box-shadow .12s; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; font: inherit; text-align: left; color: inherit; }
  .title-nav-tile:hover { transform: translateY(-1px); border-color: rgba(156,122,77,0.34); background: rgba(156,122,77,0.08); box-shadow: 0 8px 18px rgba(0,0,0,0.04); }
  .title-nav-tile.active { background: #9C7A4D; border-color: #9C7A4D; color: #fff; }
  .title-nav-tile-title { font-size: 13px; line-height: 1.2; font-weight: 600; color: #32281f; }
  .title-nav-tile.active .title-nav-tile-title { color: #fff; }
  .title-nav-tile-meta { font-size: 10px; line-height: 1.2; letter-spacing: .06em; text-transform: uppercase; color: #8a7c6a; }
  .title-nav-tile.active .title-nav-tile-meta { color: rgba(255,255,255,0.82); }
  .title-nav-provenance { font-size: 11px; line-height: 1.55; color: #776b5d; padding: 2px 4px 12px; grid-column: 1 / -1; }
  .title-nav-section { grid-column: 1 / -1; margin-top: 14px; padding: 6px 2px 2px; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #8a7c6a; }
  .title-nav-placeholder { margin: 0; font-size: .95rem; color: #8a7c6a; line-height: 1.5; grid-column: 1 / -1; }
  .title-nav-tile.book-tile { min-height: 58px; padding: 10px 8px; align-items: center; justify-content: center; text-align: center; }
  .title-nav-tile.book-tile .title-nav-tile-title { font-size: 12.5px; }
  .title-nav-tile.chapter-tile { min-height: 0; aspect-ratio: 1 / 1; padding: 0; align-items: center; justify-content: center; text-align: center; }
  .title-nav-tile.chapter-tile .title-nav-tile-title { font-size: 14px; }
  .title-nav-tile.wide { grid-column: 1 / -1; }
  .title-nav-tile.title-nav-tile--cover { padding: 0; min-height: 0; aspect-ratio: 177 / 284; border-radius: 10px; overflow: hidden; align-items: stretch; }
  .title-nav-tile.title-nav-tile--cover:hover { box-shadow: 0 10px 28px rgba(0,0,0,0.18); }
  .title-nav-tile-cover-img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  .title-nav-tile.title-nav-tile--cover.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #9C7A4D; }

  @media (max-width: 760px) {
    .title-shell { padding: 0 14px 36px; }
    .title-nav-grid { grid-template-columns: 1fr; }
    .title-nav-grid.chapter-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
</style>

<div class="title-shell">
  <div class="panel-kicker" style="text-align:center;margin-top:1.25rem">Words (of God) with friends!</div>
  <h1 class="dashboard-title">WeScripture</h1>
  <p class="title-kicker">Open the scriptures, save what you love, and share it with friends.</p>
  <p class="title-links">
    <a data-open-shelf="scriptures" href="javascript:void(0)">Scriptures</a>
    ·
    <a data-open-shelf="sources" href="javascript:void(0)">Other writings</a>
  </p>

  <div class="title-row">
    <section class="panel" aria-label="Resume and recent activity">
      <div class="panel-kicker">Continue</div>
      <h2 class="panel-title">Resume</h2>
      <p class="panel-subtitle">Pick up where you left off, or jump back into something recent.</p>
      <div class="history-row">
        <button type="button" class="history-btn" data-resume="1">
          <div class="history-label">Resume last session</div>
          <div class="history-meta" id="title-resume-meta"></div>
        </button>
      </div>
      <div class="history-row" id="title-recents"></div>
      <div class="history-row" id="title-saves"></div>
      <p class="history-empty" id="title-history-empty" hidden>No recent places yet. Open a chapter and it will appear here.</p>
    </section>

    <section id="title-nav" class="panel" aria-label="Browse">
      <div class="title-nav-head">
        <button type="button" id="title-nav-back" hidden aria-label="Back">← Back</button>
        <div>
          <div class="panel-kicker">Browse</div>
          <h2 id="title-nav-title" class="panel-title"></h2>
          <p id="title-nav-subtitle" class="panel-subtitle"></p>
        </div>
      </div>
      <div id="title-nav-grid" class="title-nav-grid"></div>
    </section>
  </div>
</div>
</body>
</html>
