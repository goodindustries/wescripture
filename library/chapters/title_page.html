<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="title_page" name="chapter-id"/>
<link href="../style/main.css" rel="stylesheet"/>
</head>
<body>
<style>
  .title-shell {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 22px 48px;
  }
  .dashboard-title {
    margin: 1.4rem auto 0.3rem;
    font: 700 2.1rem/1.1 "EB Garamond", Georgia, serif;
    color: #26221d;
    text-align: center;
  }
  .title-kicker {
    margin: 0 auto 1rem;
    max-width: 640px;
    color: #7f7467;
    font-size: 1.05rem;
    line-height: 1.55;
    text-align: center;
  }
  .title-links {
    text-align: center;
    margin: 0 0 1.25rem;
    font-size: 0.98rem;
    color: #5a4e42;
    line-height: 1.6;
  }
  .title-links a {
    color: #9C7A4D;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid rgba(156,122,77,0.35);
  }
  .title-links a:hover {
    color: #7A5E38;
    border-bottom-color: rgba(122,94,56,0.55);
  }
  @media (max-width: 760px) {
    .title-shell { padding: 0 14px 36px; }
  }
</style>
<div class="title-shell">
<h1 class="dashboard-title">WeScripture</h1>
<p class="title-kicker">Scripture and study sources in one reader, with cross-links and verse-level study tools.</p>
<p class="title-links">
<a data-open-shelf="scriptures" href="javascript:void(0)">Scriptures</a>
 ·
<a data-open-shelf="sources" href="javascript:void(0)">Other writings</a>
</p>
</div>
<script>
(function () {
  function bindShelfLinks() {
    document.querySelectorAll('[data-open-shelf]').forEach(function (link) {
      link.addEventListener('click', function (event) {
        event.preventDefault();
        var key = link.getAttribute('data-open-shelf');
        if (window.parent && typeof window.parent.postMessage === 'function') {
          window.parent.postMessage({ type: 'title-page-inline-shelf', key: key }, '*');
        }
      });
    });
  }
  bindShelfLinks();
}());
</script>
</body>
</html>
