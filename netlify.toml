[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/library/entities/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/library/chapters/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/library/word_index/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/library/dashboard_state.json"
  [headers.values]
    Cache-Control = "public, max-age=30, must-revalidate"

[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 302

[[redirects]]
  from = "/home.html"
  to = "/index.html"
  status = 302

[[redirects]]
  from = "/library/home.html"
  to = "/library/index.html"
  status = 302

[[redirects]]
  from = "/monitor"
  to = "/monitor.html"
  status = 302

# Do not add a blanket `/*` → `/index.html` (status 200) rewrite here: Netlify applies
# redirects before Functions, so it would return HTML for `/.netlify/functions/*` and
# break JSON clients (monitor history, monitor_backlog, etc.).
