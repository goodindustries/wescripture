[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/library/entities/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/library/chapters/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/library/word_index/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/library/dashboard_state.json"
  [headers.values]
    Cache-Control = "public, max-age=30, must-revalidate"

[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 302

[[redirects]]
  from = "/home.html"
  to = "/index.html"
  status = 302

[[redirects]]
  from = "/library/home.html"
  to = "/library/index.html"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
