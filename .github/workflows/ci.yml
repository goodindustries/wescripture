name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies (corpus audit)
        run: pip install "beautifulsoup4>=4.12"

      - name: Install Node dependencies (Puppeteer)
        run: npm ci

      - name: Install Chromium for Puppeteer (incl. Linux system libs)
        run: sudo env "PATH=$PATH" npx puppeteer browsers install chrome --install-deps

      - name: Python corpus + search audits
        run: |
          python3 audit_search_quality.py
          python3 lds_pipeline/audit_corpus_integrity.py

      - name: Embedding loader gaps (strict, when verse catalog is in tree)
        if: ${{ hashFiles('lds_pipeline/cache/verse_catalog.json') != '' || hashFiles('lds_pipeline/cache/standard_works/verse_catalog.json') != '' }}
        run: python3 lds_pipeline/audit_embedding_corpus_gaps.py --strict

      - name: UI regressions (Puppeteer)
        run: bash tools/run_ui_regressions.sh
