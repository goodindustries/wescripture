name: Embedding corpus audit

on:
  workflow_dispatch:

jobs:
  strict-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install "beautifulsoup4>=4.12"

      - name: audit_embedding_corpus_gaps --strict
        run: python3 lds_pipeline/audit_embedding_corpus_gaps.py --strict
