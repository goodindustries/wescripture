<!DOCTYPE html>
<html lang="en" data-assets-prefix="./library">
<head>
    <meta charset="UTF-8">

    <title>WeScripture</title>
    <meta name="description" content="Study the scriptures with your friends.">
    <meta property="og:title" content="WeScripture">
    <meta property="og:description" content="Study the scriptures with your friends.">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PCMWDK746H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PCMWDK746H');

    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16x16.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=EB+Garamond:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
<noscript>
  <p style="padding:16px;font-family:system-ui,-apple-system,sans-serif">
    <a href="./library/index.html">Open reader</a>
  </p>
</noscript>
<a class="monitor-fab" href="/monitor.html" aria-label="Open Monitor">Monitor</a>
<header class="home-header">
    <a class="home-brand" href="./" aria-label="WeScripture home">
        <span class="home-brand-name">WeScripture</span>
    </a>
    <nav class="home-nav" aria-label="Primary">
        <a class="home-nav-link" href="./library/index.html">Reader</a>
        <a class="home-nav-pill" id="auth-pill" href="./library/index.html">Sign in</a>
    </nav>
</header>

<main class="home">
    <section class="home-hero-minimal" aria-label="Welcome">
        <h1 class="home-hero-title">Study the scriptures.</h1>
        <p class="home-hero-lede">Scripture and study sources in one reader — cross-links, verse-level tools, and study with friends.</p>
        <p class="home-hero-cta-wrap">
            <a class="home-cta-primary" href="./library/index.html" data-evt="home_open_reader">Open reader</a>
        </p>
    </section>

    <section id="continue" class="home-continue" hidden aria-label="Continue reading">
        <div class="home-section-hdr">
            <div class="home-section-title">Continue reading</div>
        </div>
        <div id="continue-row" class="chip-row"></div>
    </section>

    <section class="home-library" aria-label="Scripture library">
        <div class="home-library-hdr">
            <div class="home-library-title">Standard Works</div>
        </div>
        <div id="corpus-root" class="corpus-root" aria-live="polite" aria-busy="true"></div>
    </section>

    <section class="home-feed" id="home-feed" hidden aria-label="Study feed">
        <div class="home-feed-card">
            <p class="home-feed-title">Your study feed</p>
            <p class="home-feed-sub">Follow friends to see their highlights here.</p>
        </div>
    </section>
</main>

<script>
(function() {
    var STORAGE_KEY = 'lds';
    var AUTH_KEY = 'sb-itqeijgvzfmuyjlzdqwt-auth-token';
    var READER_HOME = (function() {
        var p = document.documentElement.getAttribute('data-assets-prefix');
        return p ? p.replace(/\/$/, '') + '/index.html' : './index.html';
    })();

    function dataFilePath(rel) {
        var p = document.documentElement.getAttribute('data-assets-prefix');
        return (p ? p.replace(/\/$/, '') + '/' : './') + String(rel || '').replace(/^\.\//, '');
    }

    function safeGtag() {
        if (typeof window.gtag !== 'function') return;
        try { window.gtag.apply(null, arguments); } catch (e) {}
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function readJson(key, fallback) {
        try {
            var raw = localStorage.getItem(key);
            if (!raw) return fallback;
            return JSON.parse(raw);
        } catch (e) {
            return fallback;
        }
    }

    function pushUrl(u, evtName, evtData) {
        safeGtag('event', evtName, Object.assign({ page: 'home' }, evtData || {}));
        window.location.href = u;
    }

    // Auth: peek at Supabase localStorage session without loading the SDK
    function peekSession() {
        try {
            var raw = localStorage.getItem(AUTH_KEY);
            if (!raw) return null;
            var obj = JSON.parse(raw);
            // Supabase stores session as object or array depending on version
            var user = (obj && obj.user) || (Array.isArray(obj) && obj[0] && obj[0].user);
            if (!user) return null;
            var meta = user.user_metadata || {};
            return meta.handle || meta.username || meta.full_name || user.email || null;
        } catch (e) {
            return null;
        }
    }

    function updateAuthNav() {
        var pill = document.getElementById('auth-pill');
        if (!pill) return;
        var handle = peekSession();
        if (handle) {
            pill.textContent = handle.indexOf('@') === 0 ? handle : '@' + handle;
            pill.href = './library/index.html';
            // Show feed placeholder when signed in
            var feed = document.getElementById('home-feed');
            if (feed) feed.hidden = false;
        }
    }

    function renderContinueReading() {
        var cont = document.getElementById('continue');
        var row = document.getElementById('continue-row');
        if (!cont || !row) return;

        var pos = null;
        try { pos = localStorage.getItem(STORAGE_KEY + '_position'); } catch (e) {}
        var recents = readJson(STORAGE_KEY + '_recent_v1', { version: 1, items: [] });
        var items = [];

        if (pos) items.push({ kind: 'position', label: 'Resume', href: READER_HOME + '?jump=' + encodeURIComponent(pos.replace(/_/g, ' ')) });
        (recents.items || []).slice(0, 3).forEach(function(it) {
            if (!it || !it.href || !it.label) return;
            if (items.some(function(x) { return x.href === it.href; })) return;
            items.push(it);
        });

        if (!items.length) {
            cont.hidden = true;
            return;
        }

        row.innerHTML = items.slice(0, 3).map(function(it) {
            return '<a class="chip" href="' + escapeHtml(it.href) + '" data-evt="home_continue">' + escapeHtml(it.label) + '</a>';
        }).join('');
        cont.hidden = false;

        row.addEventListener('click', function(e) {
            var a = e.target.closest('a.chip');
            if (!a) return;
            e.preventDefault();
            pushUrl(a.getAttribute('href'), 'home_continue_reading', { target: a.textContent.trim().slice(0, 80) });
        });
    }

    var booksSuggest = [];
    var booksLoadPromise = null;

    function chapterIdToJump(cid, bookName) {
        if (!cid || !bookName) return bookName + ' 1';
        var parts = String(cid).split('_');
        var n = parts[parts.length - 1];
        if (!/^\d+$/.test(n)) return bookName + ' 1';
        return bookName + ' ' + parseInt(n, 10);
    }

    function loadBooksSuggest() {
        if (booksSuggest.length) return Promise.resolve();
        if (booksLoadPromise) return booksLoadPromise;
        var bu = (function() {
            var p = document.documentElement.getAttribute('data-assets-prefix');
            if (p) return p.replace(/\/$/, '') + '/entities/books.json';
            return './entities/books.json';
        })();
        booksLoadPromise = fetch(bu)
            .then(function(r) { return r.ok ? r.json() : []; })
            .then(function(arr) {
                booksSuggest = (arr || []).map(function(b) {
                    var cid = (b.chapter_ids && b.chapter_ids[0]) || '';
                    var slug = (b.slug && String(b.slug)) || '';
                    var slugM = slug ? slug.replace(/_/g, ' ').toLowerCase() : '';
                    return {
                        kind: 'book',
                        label: b.name || '',
                        abbr: (b.abbreviation || '').trim(),
                        slugM: slugM,
                        slug: slug,
                        testament: b.testament || '',
                        jump: chapterIdToJump(cid, b.name || '')
                    };
                }).filter(function(x) { return x.label; });
            })
            .catch(function() { booksSuggest = []; });
        return booksLoadPromise;
    }

    function strHash(s) {
        var h = 0;
        var str = String(s || '');
        for (var i = 0; i < str.length; i++) {
            h = Math.imul(31, h) + str.charCodeAt(i) | 0;
        }
        return Math.abs(h);
    }

    function bookCoverBackground(slug, testament) {
        var imgs = {
            OT: 'assets/corpus/covers/church_ot.jpg',
            NT: 'assets/corpus/covers/church_nt.jpg',
            BOM: 'assets/corpus/covers/church_bom.jpg',
            DC: 'assets/corpus/covers/church_dc.jpg',
            PGP: 'assets/corpus/covers/church_pgp.jpg'
        };
        var img = imgs[testament] || imgs.OT;
        var vol = {
            OT: { h: 28, span: 12 },
            NT: { h: 238, span: 14 },
            BOM: { h: 206, span: 18 },
            DC: { h: 142, span: 14 },
            PGP: { h: 38, span: 16 }
        };
        var v = vol[testament] || vol.OT;
        var n = strHash(slug) % (v.span + 1);
        var h1 = (v.h + n) % 360;
        var h2 = (v.h + 11 + (n % 9)) % 360;
        var grad = 'linear-gradient(152deg,hsla(' + h1 + ',38%,12%,.78) 0%,hsla(' + h2 + ',36%,6%,.85) 100%)';
        var u = dataFilePath(img).replace(/\\/g, '/');
        return 'background-image:' + grad + ",url('" + u + "');background-size:cover,cover;background-position:center,center;";
    }

    function shortCoverLabel(b) {
        var a = (b.abbr || '').trim();
        if (a.length <= 9) return a || b.label.slice(0, 6);
        return a.slice(0, 8) + '\u2026';
    }

    function renderCorpusBooks() {
        var root = document.getElementById('corpus-root');
        if (!root) return;
        if (!booksSuggest.length) {
            root.innerHTML = '<p class="corpus-error">Couldn\u2019t load scripture books. Try refreshing.</p>';
            root.setAttribute('aria-busy', 'false');
            return;
        }
        var order = ['OT', 'NT', 'BOM', 'DC', 'PGP'];
        var labels = {
            OT: 'Old Testament',
            NT: 'New Testament',
            BOM: 'Book of Mormon',
            DC: 'Doctrine and Covenants',
            PGP: 'Pearl of Great Price'
        };
        var by = {};
        order.forEach(function(t) { by[t] = []; });
        booksSuggest.forEach(function(b) {
            var t = b.testament;
            if (by[t]) by[t].push(b);
        });
        order.forEach(function(t) {
            by[t].sort(function(a, b2) { return a.label.localeCompare(b2.label); });
        });
        var html = '';
        order.forEach(function(t) {
            var list = by[t];
            if (!list.length) return;
            var tid = 'corpus-' + t.toLowerCase();
            html += '<section class="corpus-block" id="' + tid + '" aria-labelledby="' + tid + '-h">';
            html += '<h2 class="corpus-block-title" id="' + tid + '-h">' + escapeHtml(labels[t]) + '</h2>';
            html += '<div class="corpus-book-grid">';
            list.forEach(function(b) {
                var href = READER_HOME + '?jump=' + encodeURIComponent(b.jump);
                var bg = bookCoverBackground(b.slug, b.testament);
                html += '<a class="book-tile" href="' + escapeHtml(href) + '" data-evt="home_book_tile" data-book="' + escapeHtml(b.slug) + '">';
                html += '<div class="book-tile-cover" style="' + bg + '"><span class="book-tile-abbr">' + escapeHtml(shortCoverLabel(b)) + '</span></div>';
                html += '<div class="book-tile-name">' + escapeHtml(b.label) + '</div></a>';
            });
            html += '</div></section>';
        });
        root.innerHTML = html;
        root.setAttribute('aria-busy', 'false');
    }

    function wireEvents() {
        document.addEventListener('click', function(e) {
            var a = e.target.closest('a[data-evt]');
            if (!a) return;
            var payload = { page: 'home' };
            if (a.dataset.collection) payload.collection = a.dataset.collection;
            safeGtag('event', a.dataset.evt, payload);
        });
    }

    updateAuthNav();
    renderContinueReading();
    wireEvents();
    loadBooksSuggest().then(function() { renderCorpusBooks(); });
})();
</script>

</body>
</html>
